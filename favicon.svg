<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e63946"/>
      <stop offset="100%" stop-color="#d90429"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- App Logo Rounded Square -->
  <rect x="1" y="1" width="62" height="62" rx="14" fill="url(#logoGrad)" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
  <!-- App Logo Kanji Character '漢' -->
  <text x="32" y="34.5" text-anchor="middle" dominant-baseline="central" fill="#ffffff" font-family="-apple-system, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', sans-serif" font-weight="700" font-size="37" filter="url(#shadow)">漢</text>
</svg>
